<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catalogo ILSA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --ilsa:#861f41;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f3f3;
    font-family:Segoe UI,Arial,sans-serif;
}

header{
    background:var(--ilsa);
    color:white;
    text-align:center;
    padding:25px;
}

.logo{
    max-width:350px;
    width:100%;
    height:auto;
    margin-bottom:15px;
}

header h1{
    margin:0;
    font-size:42px;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:20px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.stats{
    margin-top:15px;
    margin-bottom:20px;
    color:#666;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(360px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
}

.image{
    height:260px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:white;
    padding:15px;
}

.image img{
    max-width:100%;
    max-height:220px;
    object-fit:contain;
}

.content{
    padding:18px;
}

.codice{
    color:var(--ilsa);
    font-weight:bold;
    font-size:30px;
    margin-bottom:10px;
}

.descrizione{
    min-height:80px;
    line-height:1.5;
    font-size:15px;
}

.info{
    margin-top:6px;
}

.prezzo{
    color:var(--ilsa);
    font-size:34px;
    font-weight:bold;
    margin-top:15px;
}

.badge{
    display:inline-block;
    margin-top:10px;
    background:#ff9800;
    color:white;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#777;
    padding:25px;
}

</style>

</head>

<body>

<header>

<img
src="LOGO80ILSA.jpg"
class="logo"
alt="ILSA">

<h1>Catalogo ILSA 2027</h1>

</header>
"search"
class="search"
type="text"
placeholder="Cerca codice articolo o descrizione...">

<div
id="stats"
class="stats">
Caricamento...
</div>

<div
id="lista"
class="grid">
</div>

</div>

<div class="footer">

Catalogo prodotti ILSA

</div>

<script>

const client =
supabase.createClient(
'https://ypfdfgozryeelcohdntg.supabase.co',
'sb_publishable_ROJsYJW_HNCE7HfQNf8baw_UuVfBUSg'
);

async function caricaArticoli() {

    const ricerca =
    document
    .getElementById("search")
    .value
    .trim();

    let query =
    client
    .from("articoli")
    .select("*")
    .order("codice_articolo");

    if(!ricerca){
        query = query.limit(100);
    }

    if(ricerca){

        query =
        query.or(
`codice_articolo.ilike.%${ricerca}%,descrizione_it.ilike.%${ricerca}%,descrizione_en.ilike.%${ricerca}%`
        );

    }

    const { data,error } =
    await query;

    if(error){

        document
        .getElementById("lista")
        .innerHTML =
        `<pre>${JSON.stringify(error,null,2)}</pre>`;

        return;
    }

    document
    .getElementById("stats")
    .innerHTML =
    `${data.length} articoli trovati`;

    let html = "";

    data.forEach(item=>{

        const urlFoto =
`https://ypfdfgozryeelcohdntg.supabase.co/storage/v1/object/public/prodotti/${item.nome_immagine}`;

        html += `

        <div class="card">

            <div class="image">

                <img
                src="${urlFoto}"
                alt="${item.codice_articolo}"
                onerror="this.src='https://placehold.co/400x400?text=NO+IMAGE'">

            </div>

            <div class="content">

                <div class="codice">
                    ${item.codice_articolo}
                </div>

                <div class="descrizione">
                    ${item.descrizione_it || ''}
                </div>

                <div class="info">
                    <b>EAN:</b>
                    ${item.ean || ''}
                </div>

                <div class="info">
                    <b>Pack Master:</b>
                    ${item.pack_master || ''}
                </div>

                <div class="prezzo">
                    € ${item.prezzo || ''}
                </div>

                ${
                    item.novita === 'NEW'
                    ? '<div class="badge">NOVITÀ 2027</div>'
                    : ''
                }

            </div>

        </div>

        `;

    });

    document
    .getElementById("lista")
    .innerHTML =
    html;
}

document.addEventListener(
"DOMContentLoaded",
()=>{

    caricaArticoli();

    document
    .getElementById("search")
    .addEventListener(
        "keyup",
        caricaArticoli
    );

});

</script>

</body>
</html>
