<script>

const supabaseUrl =
'https://ypfdfgozryeelcohdntg.supabase.co';

const supabaseKey =
'sb_publishable_ROJsYJW_HNCE7HfQNf8baw_UuVfBUSg';

const { createClient } = supabase;

const client =
createClient(
supabaseUrl,
supabaseKey
);

async function caricaArticoli() {

const { data, error } =
await client
.from('articoli')
.select('*')
.limit(10);

if (error) {

document.getElementById("lista").innerHTML =
"<h2>Errore</h2><pre>" +
JSON.stringify(error,null,2) +
"</pre>";

return;
}

let html = "";

for (const item of data) {

html += `
<div class="card">

<h2>${item.codice_articolo}</h2>

<p>
<b>IT:</b>
${item.descrizione_it}
</p>

<p>
<b>EN:</b>
${item.descrizione_en}
</p>

<p>
<b>EAN:</b>
${item.ean}
</p>

<p>
<b>Prezzo:</b>
€ ${item.prezzo}
</p>

<p>
<b>Novità:</b>
${item.novita}
</p>

</div>
`;
}

document.getElementById("lista").innerHTML =
html;

}

document.addEventListener(
"DOMContentLoaded",
caricaArticoli
);

</script>
