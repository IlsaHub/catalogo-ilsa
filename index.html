<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Catalogo ILSA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
padding:20px;
}

.card{
border:1px solid #ddd;
padding:10px;
margin-bottom:10px;
}
</style>

</head>

<body>

<h1>Catalogo ILSA</h1>

<div id="lista">
Caricamento...
</div>

<script>

const client = supabase.createClient(
'https://ypfdfgozryeelcohdntg.supabase.co',
'sb_publishable_ROJsYJW_HNCE7HfQNf8baw_UuVfBUSg'
);

async function test(){

const { data,error } =
await client
.from('articoli')
.select('codice_articolo,descrizione_it,prezzo')
.limit(5);

if(error){

document.getElementById('lista').innerHTML =
JSON.stringify(error);

return;
}

let html='';

data.forEach(r=>{

html += `
<div class="card">

<b>${r.codice_articolo}</b>
<br>

${r.descrizione_it}
<br>

€ ${r.prezzo}

</div>
`;

});

document.getElementById('lista').innerHTML =
html;

}

test();

</script>

</body>
</html>
