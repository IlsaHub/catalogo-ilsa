<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo ILSA</title>

<script src="https://net/npm/@supabase/supabase-jsscript>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

header{
    background:#861f41;
    color:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    font-size:16px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:8px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
}

.codice{
    font-weight:bold;
    color:#861f41;
}

.prezzo{
    font-size:18px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    background:#ff9800;
    color:white;
    padding:4px 8px;
    border-radius:4px;
    font-size:12px;
}

img{
    max-width:120px;
    max-height:120px;
    margin-top:10px;
}
</style>

</head>
<body>

<header>
<h1>Catalogo ILSA</h1>
</header>

<input
id="search"
placeholder="Cerca codice o descrizione..."
onkeyup="caricaArticoli()"
/>

<div id="lista"></div>

<script>

const supabaseUrl =
'https://ypfdfgozryeelcohdntg.supabase.co';

const supabaseKey =
'sb_publishable_ROJsYJW_HNCE7HfQNf8baw_UuVfBUSg';

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

async function caricaArticoli(){

let ricerca =
document.getElementById("search").value;

let query =
client
.from("articoli")
.select("*")
.limit(50);

if(ricerca){
query =
query.or(
`codice_articolo.ilike.%${ricerca}%,descrizione_it.ilike.%${ricerca}%`
);
}

let {data,error} =
await query;

if(error){
console.log(error);
return;
}

let html="";

data.forEach(prodotto=>{

let foto =
`https://ypfdfgozryeelcohdntg.supabase.co/storage/v1/object/public/prodotti/${prodotto.nome_immagine}`;

html += `
<div class="card">

<div class="codice">
${prodotto.codice_articolo}
</div>

<div>
${prodotto.descrizione_it}
</div>

<div class="prezzo">
€ ${prodotto.prezzo}
</div>

${prodotto.novita === "NEW"
? '<span class="badge">NOVITÀ</span>'
: ''}

<br>

<img
src="${foto}"
onerror="this.style.display='none'"
>

</div>
`;
});

document.getElementById("lista").innerHTML =
html;

}

caricaArticoli();

</script>

</body>
</html>
