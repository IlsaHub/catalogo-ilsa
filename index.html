<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo ILSA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

header{
    background:#861f41;
    color:white;
    padding:20px;
    text-align:center;
    border-radius:8px;
    margin-bottom:20px;
}

.logo{
    max-width:300px;
    margin-bottom:15px;
}

#search{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
    box-sizing:border-box;
}

.card{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
}

.codice{
    color:#861f41;
    font-weight:bold;
    font-size:18px;
}

.prezzo{
    font-weight:bold;
    margin-top:10px;
}

.badge{
    display:inline-block;
    background:#ff9800;
    color:white;
    padding:4px 8px;
    border-radius:4px;
    margin-top:5px;
}

.prodotto-img{
    max-width:120px;
    max-height:120px;
    margin-top:10px;
}
</style>

</head>

<body>

<header>
<img src="80anni%20ILSA.jpgogo ILSA</h1>
</header>

<input
type="text"
id="search"
placeholder="Cerca articolo..."
>

<div id="lista"></div>

<script>

const supabaseUrl =
'https://ypfdfgozryeelcohdntg.supabase.co';

const supabaseKey =
'sb_publishable_ROJsYJW_HNCE7HfQNf8baw_UuVfBUSg';

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

async function caricaArticoli(){

    const ricerca =
    document.getElementById("search").value;

    let query =
    client
    .from("articoli")
    .select("*")
    .limit(50);

    if(ricerca){
        query =
        query.or(
`codice_articolo.ilike.%${ricerca}%,descrizione_it.ilike.%${ricerca}%`
        );
    }

    const { data, error } =
    await query;

    if(error){

        console.error(error);

        document.getElementById("lista").innerHTML =
        "<h3>Errore Supabase</h3><pre>" +
        JSON.stringify(error,null,2) +
        "</pre>";

        return;
    }

    let html = "";

    data.forEach(item => {

        const foto =
`https://ypfdfgozryeelcohdntg.supabase.co/storage/v1/object/public/prodotti/${item.nome_immagine}`;

        html += `
        <div class="card">

            <div class="codice">
                ${item.codice_articolo}
            </div>

            <div>
                ${item.descrizione_it || ''}
            </div>

            <div class="prezzo">
                € ${item.prezzo || ''}
            </div>

            ${
                item.novita === "NEW"
                ? '<div class="badge">NOVITÀ</div>'
                : ''
            }

            <br>

            <img
            class="prodotto-img"
            src="${foto}"
            onerror="this.style.display='none'">

        </div>
        `;
    });

    document.getElementById("lista").innerHTML =
    html;
}

document.addEventListener(
"DOMContentLoaded",
function(){

    caricaArticoli();

    document
    .getElementById("search")
    .addEventListener(
        "keyup",
        caricaArticoli
    );

});

</script>

</body>
</html>
